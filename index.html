<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 92%;
    max-width: 1000px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.selector {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

select {
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: white;
    font-size: 16px;
}

.flecha { font-size: 25px; }

.cajas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.caja {
    background: #191919;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 15px;
}

.titulo-caja {
    color: #999;
    font-size: 14px;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 250px;
    resize: vertical;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 19px;
}

textarea::placeholder { color: #555; }

.botones {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { opacity: 0.85; }

.secundario {
    background: #222;
    color: white;
    border: 1px solid #444;
}

@media (max-width: 700px) {
    .cajas { grid-template-columns: 1fr; }
    .botones { flex-direction: column; }
}
</style>
</head>

<body>
<div class="app">

    <h1>Traductor Español ↔ Pancho</h1>

    <div class="subtitulo">
        Traductor para hablar con panchos
    </div>

    <div class="selector">
        <select id="direccion" onchange="traducir()">
            <option value="es-pan">Español → Panchito</option>
            <option value="pan-es">Panchito → Español</option>
        </select>
        <span class="flecha">↔</span>
    </div>

    <div class="cajas">
        <div class="caja">
            <div class="titulo-caja">ESPAÑOL / PANCHITO</div>
            <textarea id="entrada" placeholder="Escribe una frase..." oninput="traducir()"></textarea>
        </div>

        <div class="caja">
            <div class="titulo-caja">TRADUCCIÓN</div>
            <textarea id="salida" placeholder="Aquí aparecerá la traducción..." readonly></textarea>
        </div>
    </div>

    <div class="botones">
        <button onclick="traducir()">Traducir</button>
        <button class="secundario" onclick="intercambiar()">↔ Intercambiar</button>
        <button class="secundario" onclick="copiar()">Copiar</button>
    </div>
</div>

const inverso = {};

for (const palabra in diccionario) {
    const traduccion = diccionario[palabra].toLowerCase();
    if (inverso[traduccion] === undefined) {
        inverso[traduccion] = palabra;
    }
}

function escaparRegex(texto) {
    return texto.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function traducir() {
    const entrada = document.getElementById("entrada");
    const salida = document.getElementById("salida");
    const direccion = document.getElementById("direccion").value;

    if (!entrada || !salida) return;

    const texto = entrada.value;

    if (texto.trim() === "") {
        salida.value = "";
        return;
    }

    const dic = direccion === "es-pan" ? diccionario : inverso;

    const claves = Object.keys(dic).sort((a, b) => b.length - a.length);

    const letras = "A-Za-zÁÉÍÓÚÜÑáéíóúüñ";

    const patron =
        "(^|[^" + letras + "])(" +
        claves.map(escaparRegex).join("|") +
        ")(?=$|[^" + letras + "])";

    const regex = new RegExp(patron, "gi");

    salida.value = texto.replace(
        regex,
        function(match, antes, encontrada) {
            const traduccion = dic[encontrada.toLowerCase()];
            if (traduccion === undefined) return match;
            return antes + mantenerMayusculas(encontrada, traduccion);
        }
    );
}

function mantenerMayusculas(original, nuevo) {
    if (original === original.toUpperCase()) {
        return nuevo.toUpperCase();
    }

    if (
        original.length > 0 &&
        original[0] === original[0].toUpperCase()
    ) {
        return nuevo.charAt(0).toUpperCase() + nuevo.slice(1);
    }

    return nuevo;
}

function intercambiar() {
    const entrada = document.getElementById("entrada");
    const salida = document.getElementById("salida");
    const direccion = document.getElementById("direccion");

    const temporal = entrada.value;
    entrada.value = salida.value;
    salida.value = temporal;

    direccion.value =
        direccion.value === "es-pan" ? "pan-es" : "es-pan";

    traducir();
}

async function copiar() {
    const texto = document.getElementById("salida").value;
    if (!texto) return;

    try {
        await navigator.clipboard.writeText(texto);
    } catch {
        const salida = document.getElementById("salida");
        salida.select();
        document.execCommand("copy");
    }
}
